[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hermes-flight-finder"
version = "0.1.0"
description = "A CLI and Hermes skill for searching and monitoring flight prices."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hermes Flight Finder contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
    "flights>=0.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pyright>=1.1.400",
  "ruff>=0.12",
]

[project.scripts]
hermes-flights = "hermes_flight_tracker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_flight_tracker"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "live: performs a real request against a flight provider (deselected by default in CI)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
